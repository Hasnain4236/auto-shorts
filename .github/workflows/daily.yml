name: Daily Short

on:
  schedule:
    # One Short per slot, up to channel.videos_per_day (config.yaml) per UTC day, so keep the
    # number of lines here in step with it. Times are UTC (IST = UTC + 5:30). They're spread
    # out so each Short gets its own audience instead of all of them landing at once.
    # GitHub may start scheduled runs a few minutes late.
    - cron: "17 3 * * *"    # 08:47 IST
    - cron: "47 7 * * *"    # 13:17 IST
    - cron: "47 12 * * *"   # 18:17 IST
    - cron: "47 15 * * *"   # 21:17 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: make the video and send it to Telegram, but don't upload"
        type: boolean
        default: false

permissions:
  contents: write   # commit the ledger / analytics files back to the repo

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      # Earlier runs: lets a failed run resume in the next slot, and remembers which models
      # hit their daily quota. Downloaded stock clips are left out (re-downloading them is
      # quicker than caching them). The uploaded-topics ledger itself lives in git (data/).
      - name: Restore previous runs
        uses: actions/cache/restore@v4
        with:
          path: |
            runs
            !runs/_cache/footage
          key: runs-${{ github.run_id }}
          restore-keys: runs-

      - name: Learn from YouTube analytics (first run of the day only)
        continue-on-error: true
        run: python main.py learn

      - name: Make a Short
        run: |
          touch "$RUNNER_TEMP/started"
          python main.py run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Find this job's run folder
        if: always()
        run: |
          dir=$(find runs -mindepth 2 -maxdepth 2 -name state.json -newer "$RUNNER_TEMP/started" \
                -printf '%T@ %h\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
          echo "RUN_DIR=${dir:-runs/none}" >> "$GITHUB_ENV"

      - name: Prune old runs
        if: always()
        run: python main.py prune --keep-days 3

      - name: Save runs for the next slot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            runs
            !runs/_cache/footage
          key: runs-${{ github.run_id }}

      - name: Keep this video as a download (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: |
            ${{ env.RUN_DIR }}/final.mp4
            ${{ env.RUN_DIR }}/thumb.jpg
            ${{ env.RUN_DIR }}/*.json
            ${{ env.RUN_DIR }}/run.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit ledger and learning data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: ledger/analytics update"
          git pull --rebase --autostash
          git push
