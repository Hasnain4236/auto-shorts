channel:
  niche: >-
    Science & technology explained simply: surprising 'how does it work / why does
    it happen' explainers about everyday tech, AI, space, physics, the human body,
    engineering, and new discoveries.
  language: "en"            # en | hi | te ...
  audience: >-
    Broad, curious general audience aged 16–35, mostly in India, no science
    background, watching on a phone and deciding within 1–2 seconds whether to keep
    watching or swipe away.
  tone: "curious, clear, punchy, no hype, never clickbait lies"
  # Daily cap. Each `main.py run` makes ONE video; GitHub Actions runs it once per slot
  # (the cron line in .github/workflows/daily.yml), so keep the two in step. Free limits at
  # 8/day: Actions minutes are unlimited (public repo), YouTube allows 100 uploads/day, and a
  # video takes ~3 Nemotron calls (50/day shared on OpenRouter) and ~6 Gemini-key calls, with
  # Gemma and three Groq models (1,000/day each) as overflow.
  videos_per_day: 8

content:
  target_words: [130, 160]   # spoken words across hook + beats + cta (~2.7 words/s)
  hook_max_words: 8          # the hook must land within ~2 s
  beats: [5, 7]              # one idea per beat, ~6–9 s each
  on_screen_text_max_words: 5
  max_script_attempts: 3     # format-validation retries for the script writer
  max_factcheck_rewrites: 2  # per spec: abort after 2 failed rewrites
  max_topic_attempts: 3      # research tries this many candidates before aborting
  min_facts: 3
  max_facts: 5
  # Topics to avoid even if trending (wrong fit or brand-unsafe for an explainer channel)
  avoid: ["politics", "elections", "celebrity gossip", "deaths or tragedies", "crime", "medical advice", "financial advice", "war"]

trends:
  youtube_region: "IN"
  youtube_category_ids: []   # optional filter, e.g. [28] = Science & Technology (1 quota unit per id)
  google_trends_geo: "IN"
  subreddits: ["science", "technology", "explainlikeimfive"]
  min_niche_relevance: 0.7   # LLM-scored 0–1
  duplicate_similarity: 0.85 # fuzzy match threshold against the uploaded ledger
  max_candidates_scored: 60  # candidates sent to the LLM for scoring (one call)
  # If every trend source returns nothing (e.g. no API keys yet), ask the LLM for
  # evergreen topics in the niche so the pipeline still produces something.
  evergreen_fallback: true

llm:
  # Every model below is a free tier — no paid fallbacks. A provider whose API key env var
  # is unset is skipped. Model names verified 2026-11-08; free models get retired, so if a
  # run logs "model_not_found", run scripts/check_keys.py and update them here.
  #
  # Gemini free tier is ~20 requests/DAY per model, but each model has its own bucket, so
  # chaining models multiplies the daily budget. A model that hits a daily limit is skipped
  # until the quota resets. OpenRouter free models: ~50 requests/day per account (shared).
  providers:
    - {id: gemini35, name: gemini, model: "gemini-3.5-flash", api_key_env: GEMINI_API_KEY, rpm: 8}
    - {id: gemini25, name: gemini, model: "gemini-2.5-flash", api_key_env: GEMINI_API_KEY, rpm: 8}
    - {id: gemini35lite, name: gemini, model: "gemini-3.5-flash-lite", api_key_env: GEMINI_API_KEY, rpm: 12}
    - {id: gemini31lite, name: gemini, model: "gemini-3.1-flash-lite", api_key_env: GEMINI_API_KEY, rpm: 12}
    # Gemma on the Gemini API: same key, its own (much larger) free allowance. The 26B handles
    # system prompts, JSON and images; the 31B was overloaded when tested, so it's a late fallback.
    - {id: gemma26, name: gemini, model: "gemma-4-26b-a4b-it", api_key_env: GEMINI_API_KEY, rpm: 15}
    - {id: gemma31, name: gemini, model: "gemma-4-31b-it", api_key_env: GEMINI_API_KEY, rpm: 15}
    # Groq: every model has its own 1,000 requests/day (8,000 tokens/min), so each one adds capacity.
    - {id: groq_oss, name: groq, model: "openai/gpt-oss-120b", api_key_env: GROQ_API_KEY,
       base_url: "https://api.groq.com/openai/v1", rpm: 30}
    - {id: groq_oss20, name: groq, model: "openai/gpt-oss-20b", api_key_env: GROQ_API_KEY,
       base_url: "https://api.groq.com/openai/v1", rpm: 30, extra: {max_tokens: 6000}}
    - {id: groq_qwen, name: groq, model: "qwen/qwen3.8-27b", api_key_env: GROQ_API_KEY,
       base_url: "https://api.groq.com/openai/v1", rpm: 30, extra: {max_tokens: 4000}}
    # Reasoning model: low effort keeps a script call ~50 s instead of 10+ min, and max_tokens
    # must leave room for the reasoning AND the JSON answer.
    - {id: nemotron_ultra, name: openrouter, model: "nvidia/nemotron-3-ultra-550b-a55b:free",
       api_key_env: OPENROUTER_API_KEY, base_url: "https://openrouter.ai/api/v1", rpm: 10, json_format: false,
       timeout_s: 300, extra: {reasoning: {effort: low}, max_tokens: 6000}}
    - {id: nemotron_vl, name: openrouter, model: "nvidia/nemotron-3.5-super-vl:free", vision: true,
       api_key_env: OPENROUTER_API_KEY, base_url: "https://openrouter.ai/api/v1", rpm: 10,
       timeout_s: 300, extra: {reasoning: {effort: low}, max_tokens: 4000}}
    - {id: gemma, name: openrouter, model: "google/gemma-4-31b-it:free", api_key_env: OPENROUTER_API_KEY,
       base_url: "https://openrouter.ai/api/v1", rpm: 10}

  # Which models each job uses, in fallback order. Using different model families for
  # writing and fact-checking means the checker doesn't share the writer's blind spots.
  # Vision gets the Flash-Lite models first, so the other jobs lean on Gemma and Groq.
  roles:
    default: [gemini35, gemini25, gemma26, groq_oss, groq_qwen, groq_oss20, gemini35lite, gemini31lite, gemma31, gemma]
    writer:  [nemotron_ultra, gemini35, gemini25, groq_qwen, gemma26, groq_oss]   # Nemotron writes punchier
    checker: [groq_oss, groq_oss20, gemini25, gemma26, gemini35lite, gemini31lite]
    vision:  [gemini35lite, gemini31lite, gemma26, gemini25, nemotron_vl, gemma31]
  max_retries: 6
  base_backoff_s: 2.0
  max_backoff_s: 64.0
  temperature: 0.7

video:
  duration_s: [45, 60]
  resolution: [1080, 1920]
  fps: 30
  voice: "en-IN-NeerjaNeural"   # edge-tts voice
  voice_rate_pct: 25            # starting speed; auto-adjusted to fit duration_s
  music_dir: "assets/music"     # royalty-free tracks I add
  font: "assets/fonts/Inter-Bold.ttf"
  # Animated graphics for number / comparison / process beats instead of stock footage
  # (pipeline/graphics.py). Numbers in a graphic must be ones the facts state; a graphic that
  # breaks the rules is dropped (that beat gets stock footage), never fatal.
  graphics: true
  max_graphics: 2

upload:
  youtube: true
  instagram: false
  # private   = upload privately; you publish it in Studio
  # scheduled = upload privately with a go-live time; YouTube publishes it automatically,
  #             and you can stop it in Studio before then (review window)
  # public    = publish immediately (Telegram gets the same video with its link right after)
  publish_mode: public
  publish_time: "19:30"          # local go-live time for scheduled mode (Indian evening prime time)
  timezone: "Asia/Kolkata"
  min_review_hours: 2            # less review time than this left today -> go live tomorrow instead

review:
  telegram: true

learning:
  min_age_days: 3        # analytics need a few days to settle
  min_videos: 6          # public videos needed before the LLM writes a playbook
  explore_rate: 0.3      # share of videos that try a non-best hook style
  every_hours: 20        # analytics change daily, so later runs on the same day skip `learn`

paths:
  runs_dir: "runs"                       # overridden by RUNS_DIR env var (e.g. Google Drive in Colab)
  ledger: "data/uploaded_ledger.json"
